<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Konverter Nomor HP Unik</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
    .numpad-key {
      height: 3rem;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 1px solid #e2e8f0; border-radius: 0.75rem;
      background: white; transition: all 0.15s; cursor: pointer; user-select: none;
    }
    .numpad-key:active { transform: scale(0.95); background: #eff6ff; border-color: #3b82f6; }
    .length-btn.active { background-color: #3b82f6; color: white; border-color: #2563eb; }
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col justify-between p-3 max-w-sm mx-auto overflow-hidden">

  <!-- Header -->
  <div class="text-center py-2 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-lg shadow-md">
    <h1 class="text-lg font-bold text-white">Ubah Nama jadi Nomor</h1>
    <p class="text-indigo-100 text-xs">Konversi otomatis di posisi paling belakang</p>
  </div>

  <!-- Configuration -->
  <div class="mt-2">
    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest text-center mb-1">Pilih Panjang Nomor</label>
    <div class="flex gap-2">
      <button onclick="setLength(10)" id="len-10" class="length-btn w-full py-2 text-sm font-bold border rounded-lg bg-white text-slate-600 hover:bg-blue-100 transition">10</button>
      <button onclick="setLength(11)" id="len-11" class="length-btn w-full py-2 text-sm font-bold border rounded-lg bg-white text-slate-600 hover:bg-blue-100 transition">11</button>
      <button onclick="setLength(12)" id="len-12" class="length-btn w-full py-2 text-sm font-bold border rounded-lg bg-white text-slate-600 hover:bg-blue-100 transition">12</button>
      <button onclick="setLength(13)" id="len-13" class="length-btn w-full py-2 text-sm font-bold border rounded-lg bg-white text-slate-600 hover:bg-blue-100 transition">13</button>
    </div>
  </div>

  <!-- Display Section -->
  <div class="bg-white rounded-xl shadow-lg p-3 border border-slate-100 mt-2">
    <div class="space-y-2">
      <div class="relative">
        <input type="text" id="userInput"
          class="w-full px-3 py-2 text-lg font-mono text-center border-b border-slate-200 focus:border-blue-500 outline-none uppercase bg-transparent"
          placeholder="KETIK/KLIK" oninput="convert()">
        <button onclick="clearInput()" class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-red-500">✕</button>
      </div>
      <div class="bg-gradient-to-r from-slate-900 to-slate-700 rounded-lg p-3 text-white text-center shadow-inner">
        <p class="text-slate-300 text-xs uppercase tracking-widest mb-1 font-bold">Preview Nomor Kartu</p>
        <div id="numericResult" class="text-xl font-bold tracking-wide font-mono">
          <span class="text-blue-400">08</span>xxxxxxxx
        </div>
      </div>
    </div>
  </div>

  <!-- Keypad -->
  <div class="bg-white rounded-xl shadow-md p-2 border border-slate-200 mt-2">
    <div class="grid grid-cols-3 gap-2">
      <div onclick="pressKey('1')" class="numpad-key text-slate-400 italic hover:scale-105 transition-transform shadow-sm"><span class="text-lg font-bold">1</span><span class="text-[10px]">-</span></div>
      <div onclick="pressKey('2')" class="numpad-key hover:bg-blue-50 hover:scale-105 transition-transform shadow-sm"><span class="text-lg font-bold text-slate-800">2</span><span class="text-[10px] font-bold text-blue-600">ABC</span></div>
      <div onclick="pressKey('3')" class="numpad-key hover:bg-blue-50 hover:scale-105 transition-transform shadow-sm"><span class="text-lg font-bold text-slate-800">3</span><span class="text-[10px] font-bold text-blue-600">DEF</span></div>
      <div onclick="pressKey('4')" class="numpad-key hover:bg-blue-50 hover:scale-105 transition-transform shadow-sm"><span class="text-lg font-bold text-slate-800">4</span><span class="text-[10px] font-bold text-blue-600">GHI</span></div>
      <div onclick="pressKey('5')" class="numpad-key hover:bg-blue-50 hover:scale-105 transition-transform shadow-sm"><span class="text-lg font-bold text-slate-800">5</span><span class="text-[10px] font-bold text-blue-600">JKL</span></div>
      <div onclick="pressKey('6')" class="numpad-key hover:bg-blue-50 hover:scale-105 transition-transform shadow-sm"><span class="text-lg font-bold text-slate-800">6</span><span class="text-[10px] font-bold text-blue-600">MNO</span></div>
      <div onclick="pressKey('7')" class="numpad-key hover:bg-blue-50 hover:scale-105 transition-transform shadow-sm"><span class="text-lg font-bold text-slate-800">7</span><span class="text-[10px] font-bold text-blue-600">PQRS</span></div>
      <div onclick="pressKey('8')" class="numpad-key hover:bg-blue-50 hover:scale-105 transition-transform shadow-sm"><span class="text-lg font-bold text-slate-800">8</span><span class="text-[10px] font-bold text-blue-600">TUV</span></div>
      <div onclick="pressKey('9')" class="numpad-key hover:bg-blue-50 hover:scale-105 transition-transform shadow-sm"><span class="text-lg font-bold text-slate-800">9</span><span class="text-[10px] font-bold text-blue-600">WXYZ</span></div>
      <div class="numpad-key border-transparent opacity-0 pointer-events-none"></div>
      <div onclick="pressKey('0')" class="numpad-key hover:bg-blue-50 hover:scale-105 transition-transform shadow-sm"><span class="text-lg font-bold text-slate-800">0</span><span class="text-[10px] font-bold text-slate-400">+</span></div>
      <div onclick="backspace()" class="numpad-key text-red-400 hover:scale-105 transition-transform shadow-sm">⌫</div>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="mt-2 text-center">
    <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Contoh Cepat (Min. 3 Huruf)</div>
    <div class="flex justify-center gap-2">
      <button onclick="setInput('NAMAMU')" class="px-3 py-1 bg-slate-200 text-slate-700 text-xs font-bold rounded-full hover:bg-blue-100 transition">NAMAMU</button>
      <button onclick="setInput('ADA')" class="px-3 py-1 bg-slate-200 text-slate-700 text-xs font-bold rounded-full hover:bg-emerald-100 transition">ADA</button>
      <button onclick="setInput('DIHATI')" class="px-3 py-1 bg-slate-200 text-slate-700 text-xs font-bold rounded-full hover:bg-pink-100 transition">DIHATI</button>
    </div>
   </div>

    <script>
    let currentTargetLength = 12;
    const keyMap = {
      'A':'2','B':'2','C':'2',
      'D':'3','E':'3','F':'3',
      'G':'4','H':'4','I':'4',
      'J':'5','K':'5','L':'5',
      'M':'6','N':'6','O':'6',
      'P':'7','Q':'7','R':'7','S':'7',
      'T':'8','U':'8','V':'8',
      'W':'9','X':'9','Y':'9','Z':'9'
    };

    function setLength(len) {
      currentTargetLength = len;
      document.querySelectorAll('.length-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`len-${len}`).classList.add('active');
      convert();
    }

    function pressKey(val) {
      const input = document.getElementById('userInput');
      const maxCustom = currentTargetLength - 2;
      if (input.value.length < maxCustom) {
        input.value += val;
        convert();
      }
    }

    function backspace() {
      const input = document.getElementById('userInput');
      input.value = input.value.slice(0, -1);
      convert();
    }

    function clearInput() {
      document.getElementById('userInput').value = '';
      convert();
    }

    function setInput(val) {
      document.getElementById('userInput').value = val;
      convert();
    }

    function convert() {
      const input = document.getElementById('userInput').value.toUpperCase();
      let numericString = "";

      for (let char of input) {
        if (keyMap[char]) {
          numericString += keyMap[char];
        } else if (/[0-9]/.test(char)) {
          numericString += char;
        }
      }

      const fixedPrefix = "08";
      const availableSlots = currentTargetLength - 2;

      let finalDisplay = `<span class="text-blue-400">${fixedPrefix}</span>`;
      let displayDigits = "";

      const paddingCount = Math.max(0, availableSlots - numericString.length);
      for (let i = 0; i < paddingCount; i++) {
        displayDigits += "x";
      }
      displayDigits += numericString.substring(0, availableSlots);

      finalDisplay += displayDigits;
      document.getElementById('numericResult').innerHTML = finalDisplay;
    }

    window.onload = () => setLength(12);
  </script>


<!-- Footer CTA Button -->
<div class="pb-0.5">
  <a id="ctaWa" 
     href="https://api.whatsapp.com/send/?phone=6281297929294&text=Saya+mau+pesan+NomorCantik+dengan+nama+" 
     target="_blank"
     class="flex items-center justify-center gap-1.5 w-full py-1.5 bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white font-extrabold text-xs rounded-lg shadow transition-all">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
      <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
    </svg>
    Pesan Nomor Cantik
  </a>
</div>

<script>
  function updateCTA() {
    const inputText = document.getElementById('userInput').value.trim().toUpperCase();
    const resultText = document.getElementById('numericResult').innerText.trim();

    const baseUrl = "https://api.whatsapp.com/send/?phone=6281297929294&text=";
    const pesanAwal = "Saya mau pesan NomorCantik dengan nama ";

    // Gabungkan nama + hasil konversi
    const pesan = `${pesanAwal}${inputText} (Nomor: ${resultText})`;

    const fullUrl = baseUrl + encodeURIComponent(pesan) + "&type=phone_number&app_absent=0";
    document.getElementById('ctaWa').href = fullUrl;
  }

  // Update CTA setiap kali input berubah
  document.getElementById('userInput').addEventListener('input', updateCTA);

  // Jalankan sekali saat halaman load
  window.onload = updateCTA;
</script>


</body>
</html>
